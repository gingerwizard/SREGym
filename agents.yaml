agents:
  - name: stratus
    kickoff_command: python -m clients.stratus.stratus_agent.driver.driver
    kickoff_workdir: .
    kickoff_env: null
    install_script: null
    agent_version: null
  - name: autosubmit
    kickoff_command: python -m clients.autosubmit.autosubmit_agent
    kickoff_workdir: .
    kickoff_env: null
    install_script: null
    agent_version: null
  - name: codex
    kickoff_command: python -m clients.codex.driver
    kickoff_workdir: .
    kickoff_env: null
    install_script: install-codex.sh
    agent_version: null
  - name: claudecode
    kickoff_command: python -m clients.claudecode.driver
    kickoff_workdir: .
    kickoff_env: null
    install_script: install-claudecode.sh
    agent_version: null
  # Claude Code with the Radar MCP server; see clients/claudecode_radar/README.md.
  # Radar runs on the host; RADAR_MCP_URL is its endpoint as the container sees it.
  - name: claudecode_radar
    kickoff_command: python -m clients.claudecode_radar.driver
    kickoff_workdir: .
    kickoff_env:
      RADAR_MCP_URL: "http://host.docker.internal:9283/mcp"
    cluster_access: false  # no kubeconfig, no egress to the API proxy or SREGym's MCP server
    install_script: install-claudecode.sh
    agent_version: "2.1.301"  # >=2.1.296 keeps 4,096 chars of MCP server instructions
  - name: "debug"
    kickoff_command: "python -c \"import signal; signal.pause()\""
    install_script: null
    agent_version: null
  - name: gemini
    kickoff_command: python -m clients.geminicli.driver
    kickoff_workdir: .
    kickoff_env: null
    install_script: install-gemini.sh
    agent_version: null
  - name: opencode
    kickoff_command: python -m clients.opencode.driver
    kickoff_workdir: .
    kickoff_env: null
    install_script: install-opencode.sh
    agent_version: null
  - name: tierzero
    kickoff_command: python -m clients.tierzero.driver
    kickoff_workdir: .
    kickoff_env:
      TIERZERO_API_URL: "https://app.tierzero.ai"
      TIERZERO_ORG_API_KEY: "<your-api-key>"
    install_script: null
    agent_version: null
    container_isolation: false
  - name: copilot
    kickoff_command: python -m clients.copilot.driver
    kickoff_workdir: .
    kickoff_env: null
    install_script: install-copilot.sh
    agent_version: null
  - name: cursor
    kickoff_command: python -m clients.cursor.driver
    kickoff_workdir: .
    kickoff_env: null
    install_script: install-cursor.sh
    agent_version: null
  - name: demo
    kickoff_command: python -m clients.demo.driver
    kickoff_workdir: .
    kickoff_env: null
    install_script: null
    agent_version: null
    container_isolation: false
  - name: cloudthinker
    kickoff_command: python -m clients.cloudthinker.driver
    kickoff_workdir: .
    kickoff_env:
      # The client talks to the platform through its `ct` dev CLI, which resolves
      # its compose slot from the checkout it runs in. Point CT_REPO_DIR and
      # CT_BIN at your own installation.
      CT_BIN: "/usr/local/bin/ct"
      CT_REPO_DIR: "/REPLACE-WITH-YOUR-CLOUDTHINKER-CHECKOUT"
      CT_TURN_TIMEOUT: "3600"
      CT_RCA_TIMEOUT: "3600"
      CT_MAX_APPROVALS: "20"
      # The workspace holds the cluster behind the problem: its MCP connections
      # are how the agent sees it and its Kubernetes connection is how the fix is
      # applied. A workspace id is scoped to one installation, so this is a
      # placeholder to replace, not a value to inherit.
      CT_WORKSPACE: "00000000-0000-0000-0000-000000000000"
      # The model tier to benchmark. The client does not fall back to a default:
      # a run labelled by a model it never named is not comparable.
      CT_SELECTION: "model:REPLACE-WITH-YOUR-MODEL"
      # One prompt pair per mode; a prompt change ships as a new mode.
      CT_PROMPT_MODE: "scoped"
    install_script: null
    agent_version: null
    container_isolation: false

  # Same driver, same workspace -- the only difference is CT_LANE. A separate
  # agent name keeps the lanes apart: SREGym names the results file after the
  # agent, so these rows land in cloudthinker_rca_ALL_results.csv and cannot be
  # averaged into a chat-lane number by a careless glob.
  - name: cloudthinker_rca
    kickoff_command: python -m clients.cloudthinker.driver
    kickoff_workdir: .
    kickoff_env:
      CT_LANE: "rca_flow"
      CT_BIN: "/usr/local/bin/ct"
      CT_REPO_DIR: "/REPLACE-WITH-YOUR-CLOUDTHINKER-CHECKOUT"
      CT_TURN_TIMEOUT: "3600"
      CT_RCA_TIMEOUT: "3600"
      CT_MAX_APPROVALS: "20"
      CT_WORKSPACE: "00000000-0000-0000-0000-000000000000"
      CT_SELECTION: "model:REPLACE-WITH-YOUR-MODEL"
      CT_PROMPT_MODE: "scoped"
    install_script: null
    agent_version: null
    container_isolation: false
  - name: mini-sre
    kickoff_command: python -m clients.mini_sre.driver
    kickoff_workdir: .
    kickoff_env:
      MINI_SRE_HARD_CAP: "80"  # commands per stage
      MINI_SRE_DIAGNOSIS_SHARE: "0.667"  # share of --agent-timeout diagnosis may use; mitigation has the rest
    install_script: null
    agent_version: null
  # Claude Code with the ClickStack MCP server; see clients/claudecode_clickstack/README.md.
  # The MCP endpoint is the host-side auth proxy (mcp_auth_proxy.py) as the container sees it.
  # CLICKSTACK_TIER selects the clickstack-telemetry skill (0-3), matching what the collectors ship.
  - name: claudecode_clickstack
    kickoff_command: python -m clients.claudecode_clickstack.driver
    kickoff_workdir: .
    kickoff_env:
      CLICKSTACK_MCP_URL: "http://host.docker.internal:9300/mcp"
      CLICKSTACK_TIER: "2"
      CLICKSTACK_EXPECT_KUBECTL: "true"
    install_script: install-claudecode.sh
    agent_version: "2.1.318"  # newest release older than the image's 7-day npm release-age rule
